[project]
name = "loadbearing"
version = "0.1.0"
description = "Deterministic load-bearing vs. scaffolding analyzer for attack graphs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marsel" }]
keywords = ["security", "attack-graph", "ai-safety", "web3", "analysis"]

[project.scripts]
loadbearing = "lbs_core.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lbs_core*"]
